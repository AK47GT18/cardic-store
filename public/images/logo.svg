<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none">
  <defs>
    <!-- Card gradients -->
    <linearGradient id="card-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#3B5FD4"/>
    </linearGradient>
    <linearGradient id="card-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#F76B1C"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="bag-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ── White circle background ─────────────────────────────── -->
  <circle cx="110" cy="95" r="78" fill="white" filter="url(#shadow)"/>
  <circle cx="110" cy="95" r="78" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ── Fanning gift cards (behind bag) ────────────────────── -->

  <!-- Card 1: Blue (far left, most rotated) -->
  <g transform="translate(110,105) rotate(-28) translate(-28,-20)">
    <rect width="56" height="36" rx="5" fill="url(#card-blue)" filter="url(#card-shadow)"/>
    <rect x="0" y="10" width="56" height="8" fill="white" fill-opacity="0.18"/>
    <rect x="6" y="22" width="18" height="3" rx="1.5" fill="white" fill-opacity="0.5"/>
  </g>

  <!-- Card 2: Orange -->
  <g transform="translate(110,105) rotate(-14) translate(-28,-20)">
    <rect width="56" height="36" rx="5" fill="url(#card-orange)" filter="url(#card-shadow)"/>
    <rect x="0" y="10" width="56" height="8" fill="white" fill-opacity="0.18"/>
    <rect x="6" y="22" width="18" height="3" rx="1.5" fill="white" fill-opacity="0.5"/>
  </g>

  <!-- Card 3: Purple -->
  <g transform="translate(110,105) rotate(0) translate(-28,-20)">
    <rect width="56" height="36" rx="5" fill="url(#card-purple)" filter="url(#card-shadow)"/>
    <rect x="0" y="10" width="56" height="8" fill="white" fill-opacity="0.18"/>
    <rect x="6" y="22" width="18" height="3" rx="1.5" fill="white" fill-opacity="0.5"/>
  </g>

  <!-- Card 4: Cyan (right, least rotation) -->
  <g transform="translate(110,105) rotate(14) translate(-28,-20)">
    <rect width="56" height="36" rx="5" fill="url(#card-cyan)" filter="url(#card-shadow)"/>
    <rect x="0" y="10" width="56" height="8" fill="white" fill-opacity="0.18"/>
    <rect x="6" y="22" width="18" height="3" rx="1.5" fill="white" fill-opacity="0.5"/>
  </g>

  <!-- ── Shopping bag (front, center) ───────────────────────── -->
  <g filter="url(#shadow)">
    <!-- Bag body -->
    <path d="M87 82 Q87 78 91 78 H129 Q133 78 133 82 L137 118 Q137 122 133 122 H87 Q83 122 83 118 Z"
          fill="url(#bag-grad)"/>
    <!-- Bag handle left arc -->
    <path d="M97 78 Q97 66 110 66 Q123 66 123 78"
          stroke="#1E293B" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- Handle highlight -->
    <path d="M97 78 Q97 67 110 67 Q123 67 123 78"
          stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Gift box on bag -->
    <!-- Box body -->
    <rect x="101" y="94" width="18" height="16" rx="2" fill="white" fill-opacity="0.92"/>
    <!-- Box lid -->
    <rect x="99" y="90" width="22" height="6" rx="2" fill="white"/>
    <!-- Ribbon vertical -->
    <rect x="109" y="90" width="3" height="20" rx="1.5" fill="#F76B1C"/>
    <!-- Ribbon horizontal -->
    <rect x="101" y="96" width="18" height="3" rx="1.5" fill="#F76B1C"/>
    <!-- Ribbon bow left -->
    <path d="M108 92 C105 88 101 89 101 92 C101 95 107 93 110 92Z" fill="#F76B1C"/>
    <!-- Ribbon bow right -->
    <path d="M112 92 C115 88 119 89 119 92 C119 95 113 93 110 92Z" fill="#F76B1C"/>
  </g>

  <!-- ── Wordmark: "Cardic Store" ───────────────────────────── -->
  <text
    x="110" y="147"
    font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif"
    font-size="18"
    font-weight="800"
    fill="#0F172A"
    text-anchor="middle"
    letter-spacing="-0.3">Cardic Store</text>

  <!-- ── Tagline ─────────────────────────────────────────────── -->
  <text
    x="110" y="161"
    font-family="'Inter', Arial, sans-serif"
    font-size="6.2"
    font-weight="600"
    fill="#64748B"
    text-anchor="middle"
    letter-spacing="1.8">· BUY . SELL . TRADE GIFT CARDS ·</text>
</svg>

