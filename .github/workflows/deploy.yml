name: 🚀 Fast Zip & Unzip Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Zip & Fast Extract
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. PHP setup ───────────────────────────────────────────────────────
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, curl
          coverage: none

      # ── 3. Node / Vite ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 4. Composer (production, no dev) ───────────────────────────────────
      - name: Install PHP Dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress \
            --no-scripts \
            --ignore-platform-reqs

      - name: Install JS Dependencies & Build Assets
        run: |
          npm install
          npm run build

      # ── 5. Stamp a production .env onto the archive ────────────────────────
      - name: Write Production .env
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME="Cardic Store"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://cardicstore.com

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en

          APP_MAINTENANCE_DRIVER=file

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error

          DB_CONNECTION=sqlite

          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync

          CACHE_STORE=file

          MAIL_MAILER=log
          ENVEOF

      # ── 6. Build self-destructing extractor script ─────────────────────────
      - name: Build deploy_extract.php
        run: |
          DEPLOY_TOKEN="${{ secrets.DEPLOY_SECRET }}_$(date +%s%N | sha256sum | head -c 24)"
          echo "DEPLOY_TOKEN=$DEPLOY_TOKEN" >> $GITHUB_ENV

          mkdir -p public

          printf '%s' '<?php
          header("Content-Type: application/json");
          ini_set("max_execution_time", 300);
          ini_set("memory_limit", "256M");

          $expectedToken = "'"$DEPLOY_TOKEN"'";
          $givenToken    = $_GET["token"] ?? $_SERVER["HTTP_X_DEPLOY_TOKEN"] ?? "";

          if (!$expectedToken || !hash_equals($expectedToken, $givenToken)) {
              http_response_code(403);
              echo json_encode(["success" => false, "error" => "Unauthorized"]);
              exit;
          }

          $candidates = [
              __DIR__ . "/release.zip",
              dirname(__DIR__) . "/release.zip",
              realpath(__DIR__ . "/..") . "/release.zip",
          ];

          $zipFile = null;
          foreach ($candidates as $c) {
              if (file_exists($c)) { $zipFile = $c; break; }
          }

          if (!$zipFile) {
              http_response_code(404);
              echo json_encode(["success" => false, "error" => "release.zip not found", "searched" => $candidates]);
              exit;
          }

          $targetDir = realpath(dirname($zipFile)) ?: dirname($zipFile);

          $zip = new ZipArchive();
          if ($zip->open($zipFile) !== true) {
              http_response_code(500);
              echo json_encode(["success" => false, "error" => "Cannot open zip archive"]);
              exit;
          }

          $count = $zip->numFiles;
          $zip->extractTo($targetDir);
          $zip->close();

          @unlink($zipFile);

          // Remove default DirectAdmin / cPanel coming-soon index.html so LiteSpeed serves index.php
          if (file_exists($targetDir . "/index.html")) {
              @unlink($targetDir . "/index.html");
          }

          @chmod($targetDir . "/storage",          0775);
          @chmod($targetDir . "/bootstrap/cache",  0775);

          $log = [];
          $php = defined("PHP_BINARY") && strpos(PHP_BINARY, "fpm") === false ? PHP_BINARY : "php";
          $artisan = $targetDir . "/artisan";

          $cmds = [
              "optimize:clear",
              "config:cache",
              "route:cache",
              "view:cache",
          ];

          foreach ($cmds as $cmd) {
              $out = @shell_exec("$php $artisan $cmd 2>&1");
              if ($out) {
                  $log[$cmd] = trim($out);
              }
          }

          if (empty($log) && file_exists($targetDir . "/bootstrap/app.php")) {
              try {
                  require_once $targetDir . "/vendor/autoload.php";
                  $app = require_once $targetDir . "/bootstrap/app.php";
                  $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
                  $kernel->call("optimize:clear");
                  $kernel->call("config:cache");
                  $kernel->call("route:cache");
                  $kernel->call("view:cache");
                  $log["kernel"] = "Artisan cache successfully optimized via application kernel";
              } catch (Throwable $e) {
                  $log["kernel_error"] = $e->getMessage();
              }
          }

          @unlink(__FILE__);
          if (file_exists($targetDir . "/public/deploy_extract.php")) {
              @unlink($targetDir . "/public/deploy_extract.php");
          }
          if (file_exists($targetDir . "/deploy_extract.php")) {
              @unlink($targetDir . "/deploy_extract.php");
          }

          echo json_encode([
              "success"         => true,
              "files_extracted" => $count,
              "target_dir"      => $targetDir,
              "artisan"         => $log,
              "deployed_at"     => date("Y-m-d H:i:s T"),
          ]);
          ' > public/deploy_extract.php

          echo "✅ Extractor written (token embedded, size=$(wc -c < public/deploy_extract.php) bytes)"

      # ── 7. Package everything into one archive ─────────────────────────────
      - name: Create release.zip
        run: |
          zip -r release.zip . \
            --exclude "*.git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude "tests/*" \
            --exclude "storage/logs/*" \
            --exclude "storage/framework/cache/*" \
            --exclude "storage/framework/sessions/*" \
            --exclude "storage/framework/views/*" \
            --exclude ".phpunit.result.cache" \
            --exclude "*.tmp" \
            --exclude "deploy.ps1"

          echo "📦 Archive size: $(du -sh release.zip | cut -f1)"

      # ── 8. Stage files & Normalize Remote Path ──────────────────────────────
      - name: Stage files for FTP upload
        run: |
          mkdir -p ftp_stage/public
          cp release.zip               ftp_stage/release.zip
          cp public/deploy_extract.php ftp_stage/deploy_extract.php
          cp public/deploy_extract.php ftp_stage/public/deploy_extract.php

          # DirectAdmin / cPanel FTP accounts are already jailed inside their user directory (/home/arutmwht).
          # Therefore the target directory must be "public_html/", not "/home/arutmwht/public_html/".
          RAW_PATH="${{ secrets.REMOTE_PATH }}"
          RAW_PATH="${RAW_PATH#/}"
          RAW_PATH="${RAW_PATH#home/*/}"
          if [[ -z "$RAW_PATH" || "$RAW_PATH" == "/" ]]; then
            RAW_PATH="public_html/"
          fi
          if [[ "$RAW_PATH" != */ ]]; then
            RAW_PATH="${RAW_PATH}/"
          fi
          echo "FTP_TARGET_DIR=$RAW_PATH" >> $GITHUB_ENV
          echo "Sanitized FTP Target Directory: $RAW_PATH"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ftp_stage/
          server-dir: ${{ env.FTP_TARGET_DIR }}
          dangerous-clean-slate: false

      # ── 9. Trigger extraction on the live server ───────────────────────────
      - name: Trigger Server-Side Extraction
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          
          URLS=(
            "$APP_URL/deploy_extract.php?token=$DEPLOY_TOKEN"
            "$APP_URL/public/deploy_extract.php?token=$DEPLOY_TOKEN"
          )

          for i in 1 2 3 4 5; do
            for URL in "${URLS[@]}"; do
              echo "⚡ Probing: $URL"
              RESPONSE=$(curl -ksS --max-time 90 "$URL" 2>&1) || true
              echo "Response: $RESPONSE"

              if echo "$RESPONSE" | grep -q '"success":true'; then
                echo ""
                echo "🎉 DEPLOYMENT COMPLETE! Files extracted and caches warmed in seconds."
                exit 0
              fi
            done
            echo "Waiting 5s before next attempt..."
            sleep 5
          done

          echo "⚠️ Automated extraction could not be confirmed via HTTP."
          echo "   release.zip is safely uploaded on your server at ${{ env.FTP_TARGET_DIR }}."
          exit 1
