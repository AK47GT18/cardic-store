<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 40px; font-family: sans-serif; background: #050D1A; color: white; }
.box { display: inline-block; padding: 20px; border: 1px solid #334155; border-radius: 12px; margin-right: 20px; }
</style>
</head>
<body>
<div class="box" style="background: #050D1A;">
  <p>Dark Background (#050D1A) - logo-white.png (h=48px):</p>
  <img src="logo-white.png" style="height: 48px; width: auto; display: block;">
</div>
<div class="box" style="background: #050D1A;">
  <p>Dark Background - logo-white.png (h=64px):</p>
  <img src="logo-white.png" style="height: 64px; width: auto; display: block;">
</div>
<div class="box" style="background: #FFFFFF; color: #0F172A;">
  <p>White Background - logo-transparent.png (h=48px):</p>
  <img src="logo-transparent.png" style="height: 48px; width: auto; display: block;">
</div>
</body>
</html>
